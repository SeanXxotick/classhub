<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassHub 2.0 mockups</title>
<style>
/* ---- Copied verbatim from web/src/design/tokens.css (keep identical) ---- */
/*
 * ClassHub 2.0 design tokens.
 *
 * Naming: every token starts with --ch- and reads  --ch-<group>-<name>[-<variant>].
 *   --ch-bg, --ch-surface, --ch-surface-2      page and card backgrounds
 *   --ch-text, --ch-text-muted                 text colours
 *   --ch-border, --ch-border-strong            hairlines and input outlines
 *   --ch-primary*                              the class accent (derived from --ch-accent)
 *   --ch-income / -charge / -withdrawal / -payout / -opening
 *                                              the five money colours; each has a -soft tint
 *   --ch-success / -warning / -danger / -info  status colours; each has a -soft tint
 *   --ch-fs-*, --ch-fw-*, --ch-lh-*            type scale (size, weight, line height)
 *   --ch-space-1 ... --ch-space-12             4px spacing scale
 *   --ch-radius-*, --ch-shadow-*, --ch-dur-*   shape, elevation, motion
 *   --ch-w-*, --ch-h-*, --ch-tap               layout widths and control heights
 *
 * Theme: colours are defined for light, then redefined for dark in two places that must stay
 * identical: the OS preference (guarded so an explicit light choice wins) and data-theme="dark".
 * The app sets data-theme="dark" today and removes the attribute for light; phase 3 must set
 * data-theme="light" explicitly (see the report) so the media query cannot override a light choice.
 *
 * Per-class accent: set --ch-accent (a #RRGGBB value) on an element with class "ch-accented".
 * Everything accent-coloured (--ch-primary*, --ch-hero, --ch-focus) is derived from it and is
 * recomputed on that element. Brand default: #0F766E.
 *
 * Money rule: amounts use font-variant-numeric: var(--ch-numeric) and white-space: nowrap.
 * State colours never carry meaning alone: pair them with an icon or a word.
 */

:root {
  /* ---- Brand and accent ------------------------------------------------ */
  --ch-brand: #0f766e;
  --ch-accent: var(--ch-brand);

  /* ---- Surfaces and text (light) --------------------------------------- */
  --ch-bg: #f6f8fb;
  --ch-surface: #ffffff;
  --ch-surface-2: #eef1f6;
  --ch-text: #1a1c1e;
  --ch-text-muted: #596478;
  --ch-border: #d5dbe5;
  --ch-border-strong: #8892a5;
  --ch-scrim: rgba(15, 20, 28, 0.45);
  --ch-on-solid: #ffffff;

  /* ---- Money colours (light) ------------------------------------------- */
  --ch-income: #146c34;
  --ch-charge: #b91c1c;
  --ch-withdrawal: #0369a1;
  --ch-payout: #8a5a00;
  --ch-opening: #475569;

  /* ---- Status colours (light) ------------------------------------------ */
  --ch-success: #146c34;
  --ch-warning: #a35207;
  --ch-danger: #b91c1c;
  --ch-info: #0369a1;

  /* ---- Tints: soft backgrounds made from a colour ----------------------- */
  --ch-tint: 13%;
  --ch-income-soft: color-mix(in srgb, var(--ch-income) var(--ch-tint), var(--ch-surface));
  --ch-charge-soft: color-mix(in srgb, var(--ch-charge) var(--ch-tint), var(--ch-surface));
  --ch-withdrawal-soft: color-mix(in srgb, var(--ch-withdrawal) var(--ch-tint), var(--ch-surface));
  --ch-payout-soft: color-mix(in srgb, var(--ch-payout) var(--ch-tint), var(--ch-surface));
  --ch-opening-soft: color-mix(in srgb, var(--ch-opening) var(--ch-tint), var(--ch-surface));
  --ch-success-soft: color-mix(in srgb, var(--ch-success) var(--ch-tint), var(--ch-surface));
  --ch-warning-soft: color-mix(in srgb, var(--ch-warning) var(--ch-tint), var(--ch-surface));
  --ch-danger-soft: color-mix(in srgb, var(--ch-danger) var(--ch-tint), var(--ch-surface));
  --ch-info-soft: color-mix(in srgb, var(--ch-info) var(--ch-tint), var(--ch-surface));
  --ch-hover: color-mix(in srgb, var(--ch-text) 5%, transparent);
  --ch-pressed: color-mix(in srgb, var(--ch-text) 9%, transparent);

  /* ---- Elevation -------------------------------------------------------- */
  --ch-card-border: transparent;
  --ch-shadow-1: 0 1px 2px rgba(15, 20, 28, 0.04), 0 4px 16px rgba(15, 20, 28, 0.06);
  --ch-shadow-2: 0 8px 24px rgba(15, 20, 28, 0.16);
  --ch-shadow-3: 0 10px 40px rgba(15, 20, 28, 0.3);

  /* ---- Type ------------------------------------------------------------- */
  --ch-font: 'Roboto Variable', 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --ch-font-mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --ch-numeric: tabular-nums lining-nums;
  --ch-fs-caption: 12px;
  --ch-fs-small: 13px;
  --ch-fs-body: 15px;
  --ch-fs-lead: 16px;
  --ch-fs-title: 20px;
  --ch-fs-headline: 24px;
  --ch-fs-display: 32px;
  --ch-fw-regular: 400;
  --ch-fw-medium: 500;
  --ch-fw-semibold: 600;
  --ch-fw-bold: 700;
  --ch-fw-black: 800;
  --ch-lh-tight: 1.2;
  --ch-lh-snug: 1.3;
  --ch-lh-normal: 1.45;
  --ch-ls-label: 0.06em;
  --ch-ls-money: -0.01em;

  /* ---- Spacing (4px base) ----------------------------------------------- */
  --ch-space-1: 4px;
  --ch-space-2: 8px;
  --ch-space-3: 12px;
  --ch-space-4: 16px;
  --ch-space-5: 20px;
  --ch-space-6: 24px;
  --ch-space-8: 32px;
  --ch-space-10: 40px;
  --ch-space-12: 48px;

  /* ---- Shape ------------------------------------------------------------ */
  --ch-radius-sm: 8px;
  --ch-radius-md: 12px;
  --ch-radius-lg: 16px;
  --ch-radius-xl: 24px;
  --ch-radius-pill: 999px;

  /* ---- Motion ----------------------------------------------------------- */
  --ch-dur-fast: 120ms;
  --ch-dur-base: 180ms;
  --ch-dur-slow: 280ms;
  --ch-ease: cubic-bezier(0.2, 0, 0, 1);

  /* ---- Layout and controls ---------------------------------------------- */
  --ch-w-sidebar: 288px;
  --ch-w-page: 1080px;
  --ch-w-narrow: 680px;
  --ch-w-dialog: 460px;
  --ch-w-wide-from: 900px; /* single column with a bottom tab bar below this; media queries cannot read it */
  --ch-h-topbar: 60px;
  --ch-h-bottom-nav: 64px;
  --ch-h-input: 48px;
  --ch-tap: 44px;
}

/*
 * Accent-derived tokens. Declared on :root and again on .ch-accented, so setting --ch-accent
 * on any element recolours everything inside it. The fallback line uses color-mix; browsers
 * that know relative colours (the @supports block) get a better-tuned lightness.
 */
:root,
.ch-accented {
  --ch-primary: var(--ch-accent);
  --ch-on-primary: #ffffff;
  --ch-primary-text: color-mix(in srgb, var(--ch-accent) 78%, #000);
  --ch-primary-soft: color-mix(in srgb, var(--ch-accent) 14%, var(--ch-surface));
  --ch-hero: var(--ch-accent);
  --ch-on-hero: #ffffff;
  --ch-focus: var(--ch-primary-text);
}

@supports (color: oklch(from red l c h)) {
  :root,
  .ch-accented {
    --ch-primary-text: oklch(from var(--ch-accent) min(l, 0.47) c h);
  }
}

:root {
  --ch-hero-danger: #b91c1c;
  color-scheme: light;
  font-family: var(--ch-font);
  font-size: var(--ch-fs-body);
  line-height: var(--ch-lh-normal);
  color: var(--ch-text);
  background: var(--ch-bg);
}

/* ======================================================================
   Dark theme. Keep the two blocks below identical.
   ====================================================================== */

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --ch-bg: #0f141c;
    --ch-surface: #161d27;
    --ch-surface-2: #222b37;
    --ch-text: #e6e9ef;
    --ch-text-muted: #a7b1c2;
    --ch-border: #344052;
    --ch-border-strong: #66748a;
    --ch-scrim: rgba(0, 0, 0, 0.6);
    --ch-income: #4ade80;
    --ch-charge: #f87171;
    --ch-withdrawal: #38bdf8;
    --ch-payout: #facc15;
    --ch-opening: #a9b4c6;
    --ch-success: #4ade80;
    --ch-warning: #fbbf24;
    --ch-danger: #f87171;
    --ch-info: #38bdf8;
    --ch-tint: 20%;
    --ch-card-border: color-mix(in srgb, var(--ch-border) 55%, transparent);
    --ch-shadow-1: none;
    --ch-shadow-2: 0 8px 24px rgba(0, 0, 0, 0.5);
    --ch-shadow-3: 0 10px 40px rgba(0, 0, 0, 0.6);
    --ch-hero-danger: color-mix(in srgb, #f87171 30%, #161d27);
    color-scheme: dark;
  }

  :root:not([data-theme='light']),
  :root:not([data-theme='light']) .ch-accented {
    --ch-primary: color-mix(in srgb, var(--ch-accent) 55%, #fff);
    --ch-on-primary: #0f141c;
    --ch-primary-text: var(--ch-primary);
    --ch-primary-soft: color-mix(in srgb, var(--ch-accent) 30%, var(--ch-surface));
    --ch-hero: color-mix(in srgb, var(--ch-accent) 30%, var(--ch-surface));
    --ch-on-hero: #f1f5f9;
    --ch-focus: var(--ch-primary);
  }

  @supports (color: oklch(from red l c h)) {
    :root:not([data-theme='light']),
    :root:not([data-theme='light']) .ch-accented {
      --ch-primary: oklch(from var(--ch-accent) max(l, 0.8) c h);
    }
  }
}

:root[data-theme='dark'] {
  --ch-bg: #0f141c;
  --ch-surface: #161d27;
  --ch-surface-2: #222b37;
  --ch-text: #e6e9ef;
  --ch-text-muted: #a7b1c2;
  --ch-border: #344052;
  --ch-border-strong: #66748a;
  --ch-scrim: rgba(0, 0, 0, 0.6);
  --ch-income: #4ade80;
  --ch-charge: #f87171;
  --ch-withdrawal: #38bdf8;
  --ch-payout: #facc15;
  --ch-opening: #a9b4c6;
  --ch-success: #4ade80;
  --ch-warning: #fbbf24;
  --ch-danger: #f87171;
  --ch-info: #38bdf8;
  --ch-tint: 20%;
  --ch-card-border: color-mix(in srgb, var(--ch-border) 55%, transparent);
  --ch-shadow-1: none;
  --ch-shadow-2: 0 8px 24px rgba(0, 0, 0, 0.5);
  --ch-shadow-3: 0 10px 40px rgba(0, 0, 0, 0.6);
  --ch-hero-danger: color-mix(in srgb, #f87171 30%, #161d27);
  color-scheme: dark;
}

:root[data-theme='dark'],
:root[data-theme='dark'] .ch-accented {
  --ch-primary: color-mix(in srgb, var(--ch-accent) 55%, #fff);
  --ch-on-primary: #0f141c;
  --ch-primary-text: var(--ch-primary);
  --ch-primary-soft: color-mix(in srgb, var(--ch-accent) 30%, var(--ch-surface));
  --ch-hero: color-mix(in srgb, var(--ch-accent) 30%, var(--ch-surface));
  --ch-on-hero: #f1f5f9;
  --ch-focus: var(--ch-primary);
}

@supports (color: oklch(from red l c h)) {
  :root[data-theme='dark'],
  :root[data-theme='dark'] .ch-accented {
    --ch-primary: oklch(from var(--ch-accent) max(l, 0.8) c h);
  }
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --ch-dur-fast: 0ms;
    --ch-dur-base: 0ms;
    --ch-dur-slow: 0ms;
  }
}

/* ====================================================================
   Mockup layer: the control bar and the stage are NOT part of the design.
   Everything inside .dev below uses only the tokens above.
   ==================================================================== */
:root { --stage: #d9dfe9; }
:root[data-theme='dark'] { --stage: #05070a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --stage: #05070a; } }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--stage); }
body { -webkit-font-smoothing: antialiased; }

#controls {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  padding: 8px 12px; background: #111827; color: #e5e7eb;
  font: 13px/1.3 system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
#controls label { display: inline-flex; align-items: center; gap: 6px; }
#controls select, #controls button {
  font: inherit; color: #f9fafb; background: #1f2937; border: 1px solid #4b5563; border-radius: 6px; padding: 5px 8px; min-height: 32px;
}
#controls button[aria-pressed='true'] { background: #0f766e; border-color: #5eead4; }
#controls .grp { display: inline-flex; gap: 0; }
#controls .grp button { border-radius: 0; }
#controls .grp button:first-child { border-radius: 6px 0 0 6px; }
#controls .grp button:last-child { border-radius: 0 6px 6px 0; }
#controls strong { font-weight: 700; margin-right: 4px; }
#stage { padding: 16px 0 40px; }

.dev {
  position: relative; margin: 0 auto; overflow: clip; min-height: 780px;
  background: var(--ch-bg); color: var(--ch-text);
  font-family: var(--ch-font); font-size: var(--ch-fs-body); line-height: var(--ch-lh-normal);
  box-shadow: var(--ch-shadow-3);
}
.dev.is-phone { width: 390px; border-radius: 28px; }
.dev.is-wide { width: 1280px; border-radius: 12px; }
@media (max-width: 420px) { .dev.is-phone { border-radius: 0; box-shadow: none; } #stage { padding-top: 0; } }
.dev * { box-sizing: border-box; }
.dev h1, .dev h2, .dev h3, .dev p { margin: 0; }
.dev h1, .dev h2, .dev h3 { line-height: var(--ch-lh-snug); }
:where(.dev) :where(button, input, select, textarea) { font: inherit; color: inherit; }
.dev a { color: var(--ch-primary-text); }
.dev :focus-visible { outline: 2px solid var(--ch-focus); outline-offset: 2px; }
.dev .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------- Shell ---------------- */
.app { display: flex; min-height: 780px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.is-phone .wide-only { display: none !important; }
.is-wide .phone-only { display: none !important; }
.sidebar { flex: none; width: var(--ch-w-sidebar); background: var(--ch-surface); border-right: 1px solid var(--ch-border); }
.is-phone .sidebar { display: none; }
.sidebar-in { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; padding: var(--ch-space-5) var(--ch-space-3); min-height: 640px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: var(--ch-fw-black); font-size: var(--ch-fs-title); padding: 4px 8px 16px; }
.brand svg { width: 34px; height: 34px; border-radius: 10px; }
.side-label { font-size: var(--ch-fs-caption); font-weight: var(--ch-fw-bold); letter-spacing: var(--ch-ls-label); text-transform: uppercase; color: var(--ch-text-muted); padding: 12px 10px 4px; }
.side-item { display: flex; align-items: center; gap: 10px; min-height: var(--ch-tap); padding: 6px 10px; border-radius: var(--ch-radius-md); border: 0; background: none; width: 100%; text-align: left; cursor: pointer; color: var(--ch-text); transition: background var(--ch-dur-fast) var(--ch-ease); }
.side-item:hover { background: var(--ch-surface-2); }
.side-item.active { background: var(--ch-primary-soft); font-weight: var(--ch-fw-bold); }
.side-item .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-spacer { flex: 1; }
.class-dot { width: 30px; height: 30px; border-radius: var(--ch-radius-sm); flex: none; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: var(--ch-fw-bold); font-size: 12px; background: var(--ch-accent); }
.side-plus { width: 30px; height: 30px; border-radius: var(--ch-radius-sm); border: 1px dashed var(--ch-border-strong); display: inline-flex; align-items: center; justify-content: center; color: var(--ch-text-muted); flex: none; }

.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; min-height: var(--ch-h-topbar); padding: 8px 12px 8px 8px; background: color-mix(in srgb, var(--ch-bg) 94%, transparent); backdrop-filter: blur(8px); }
.is-wide .topbar { padding-left: 24px; padding-right: 24px; }
.topbar-in { width: 100%; max-width: var(--ch-w-page); margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.topbar .title { flex: 1; min-width: 0; font-size: var(--ch-fs-title); font-weight: var(--ch-fw-bold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page { width: 100%; max-width: var(--ch-w-page); margin: 0 auto; padding: var(--ch-space-3) var(--ch-space-4) var(--ch-space-6); flex: 1; }
.is-wide .page { padding: var(--ch-space-5) var(--ch-space-6) var(--ch-space-12); }
.page.narrow { max-width: var(--ch-w-narrow); }
.page.has-fab { padding-bottom: 96px; }

.bottom-nav { position: sticky; bottom: 0; z-index: 30; display: flex; background: var(--ch-surface); border-top: 1px solid var(--ch-border); min-height: var(--ch-h-bottom-nav); }
.bottom-nav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0 8px; border: 0; background: none; color: var(--ch-text-muted); font-size: var(--ch-fs-caption); font-weight: var(--ch-fw-semibold); cursor: pointer; }
.bottom-nav button.selected { color: var(--ch-primary-text); }
.nav-icon { display: inline-flex; padding: 2px 16px; border-radius: var(--ch-radius-pill); transition: background var(--ch-dur-base) var(--ch-ease); }
.bottom-nav button.selected .nav-icon { background: var(--ch-primary-soft); }

.fab-wrap { position: sticky; bottom: calc(var(--ch-h-bottom-nav) + 16px); height: 0; z-index: 25; display: flex; justify-content: flex-end; padding-right: var(--ch-space-4); pointer-events: none; }
.is-wide .fab-wrap { bottom: 24px; padding-right: 32px; }
.fab-wrap.no-nav { bottom: 16px; }
.fab { pointer-events: auto; position: absolute; bottom: 0; right: 16px; min-height: 56px; padding: 0 22px 0 16px; gap: 8px; border-radius: var(--ch-radius-lg); box-shadow: var(--ch-shadow-2); display: inline-flex; align-items: center; border: 0; background: var(--ch-primary); color: var(--ch-on-primary); font-weight: var(--ch-fw-bold); cursor: pointer; white-space: nowrap; }
.is-wide .fab { right: 32px; }

/* ---------------- Cards, lists, text ---------------- */
.card { background: var(--ch-surface); border-radius: var(--ch-radius-lg); box-shadow: var(--ch-shadow-1); border: 1px solid var(--ch-card-border); padding: var(--ch-space-4); }
.card.flush { padding: var(--ch-space-2) 0; }
.card.tinted { background: var(--ch-primary-soft); box-shadow: none; }
.card.hero { background: var(--ch-hero); color: var(--ch-on-hero); border: 0; }
.card.hero.danger { background: var(--ch-hero-danger); }
.card.hero .soft { opacity: 0.88; }
.card-title, .card h2 { font-size: var(--ch-fs-lead); font-weight: var(--ch-fw-bold); }
.stack { display: flex; flex-direction: column; gap: var(--ch-space-3); }
.stack.lg { gap: var(--ch-space-5); }
.row { display: flex; align-items: center; gap: var(--ch-space-3); }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--ch-space-4); align-items: start; }
.is-phone .cols { display: flex; flex-direction: column; gap: var(--ch-space-5); }
.col { display: flex; flex-direction: column; gap: var(--ch-space-5); min-width: 0; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--ch-space-4); align-items: start; }
.is-phone .grid-auto { grid-template-columns: minmax(0, 1fr); }
.muted { color: var(--ch-text-muted); }
.small { font-size: var(--ch-fs-small); }
.caption { font-size: var(--ch-fs-caption); }
.bold { font-weight: var(--ch-fw-bold); }
.semibold { font-weight: var(--ch-fw-semibold); }
.center { text-align: center; }
.wrap-any { overflow-wrap: anywhere; }
.ellipsis { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.struck { text-decoration: line-through; }
.section-head { display: flex; align-items: center; gap: var(--ch-space-2); min-height: 36px; padding-left: 4px; }
.section-head h2 { font-size: var(--ch-fs-lead); font-weight: var(--ch-fw-bold); flex: 1; }
.section-head .btn.text { margin-right: -12px; }
.section-label { font-size: var(--ch-fs-caption); font-weight: var(--ch-fw-bold); letter-spacing: var(--ch-ls-label); text-transform: uppercase; color: var(--ch-text-muted); padding: var(--ch-space-3) var(--ch-space-4) var(--ch-space-1); }
.divider { height: 1px; background: var(--ch-border); border: 0; margin: var(--ch-space-2) 0; }
.list-row { display: flex; align-items: center; gap: var(--ch-space-3); padding: var(--ch-space-3) var(--ch-space-4); min-height: 56px; width: 100%; text-align: left; background: none; border: 0; color: inherit; text-decoration: none; }
.list-row + .list-row, .section-label + .list-row { box-shadow: none; }
.list-row + .list-row { border-top: 1px solid color-mix(in srgb, var(--ch-border) 60%, transparent); }
button.list-row, a.list-row, .list-row.clickable { cursor: pointer; transition: background var(--ch-dur-fast) var(--ch-ease); }
button.list-row:hover, .list-row.clickable:hover { background: var(--ch-hover); }
.list-row .title { font-weight: var(--ch-fw-semibold); }
.list-row .sub { font-size: var(--ch-fs-small); color: var(--ch-text-muted); }
.end-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; text-align: right; }
.chev { color: var(--ch-text-muted); flex: none; }

const TABS = [['home', 'Home', 'home', 'Home'], ['ledger', 'Ledger', 'ledger', 'Ledger'], ['schedule', 'Schedule', 'schedule', 'Schedule'], ['contents', 'Contents', 'contents', 'Contents'], ['news', 'Announcements', 'news', 'News'], ['members', 'Members', 'members', 'Members']];
const tabOn = (id) => id === 'home' || id === 'members' || (id === 'ledger' && S.modules.ledger) || (id === 'schedule' && (S.modules.schedule || S.modules.timetable)) || (id === 'contents' && S.modules.contents) || (id === 'news' && S.modules.news);

function topbar(title, o) {
  o = o || {};
  const back = o.back ? `<button type="button" class="btn text back-btn" data-back="1" aria-label="Back to ${o.backLabel || 'the previous screen'}">${ic('back', 22)}<span>${o.backLabel || 'Back'}</span></button>` : '';
  return `<header class="topbar"><div class="topbar-in">${back}<h1 class="title">${title}</h1>${o.actions || ''}</div></header>`;
}
function sidebar(active) {
  const cls = (id, name, color, role) => `<button type="button" class="side-item${active === id ? ' active' : ''}" data-go="${id === 'bscs' ? 'home' : 'classes'}"><span class="class-dot" style="background:${color}">${initials(name)}</span><span class="grow">${name}</span></button>`;
  return `<aside class="sidebar wide-only" aria-label="Classes"><div class="sidebar-in">
    <div class="brand">${LOGO(34)}ClassHub</div>
    <div class="side-label">My classes</div>
    ${cls('bscs', S.className, S.accent)}
    ${cls('org', 'CS Organization Officers', '#6366F1')}
    ${cls('it', 'BSIT 1C', '#DB2777')}
    <button type="button" class="side-item" data-dlg="join"><span class="side-plus">${ic('plus', 16)}</span><span class="grow">Join with a code</span></button>
    <button type="button" class="side-item" data-go="create"><span class="side-plus">${ic('plus', 16)}</span><span class="grow">Create a class</span></button>
    <div class="side-spacer"></div>
    <button type="button" class="side-item${active === 'account' ? ' active' : ''}" data-go="account">${avatar(me().name, 30)}<span class="grow">${me().name}</span></button>
  </div></aside>`;
}
function tabsWide(cur) {
  return `<nav class="tabs wide-only" aria-label="Class sections">${TABS.filter((t) => tabOn(t[0])).map((t) => `<button type="button" class="tab${t[0] === cur ? ' selected' : ''}" data-act="tab" data-val="${t[0]}"${t[0] === cur ? ' aria-current="page"' : ''}>${ic(t[2], 20)}${t[1]}${t[0] === 'members' && can('MEMBERS_MANAGE') ? `<span class="count">${REQUESTS.length}</span>` : ''}</button>`).join('')}</nav>`;
}
function bottomNav(cur) {
  return `<nav class="bottom-nav phone-only" aria-label="Class sections">${TABS.filter((t) => tabOn(t[0])).map((t) => `<button type="button" class="${t[0] === cur ? 'selected' : ''}" data-act="tab" data-val="${t[0]}"${t[0] === cur ? ' aria-current="page"' : ''}><span class="nav-icon">${ic(t[2], 24)}</span>${t[3]}</button>`).join('')}</nav>`;
}
function gearBtn() { return `<button type="button" class="icon-btn" data-go="mine" aria-label="My settings for this class">${ic('sliders', 24)}</button>`; }

/* kind: tab (class tab screen), sub (class subscreen), top (outside a class), auth */
function frame(kind, title, body, o) {
  o = o || {};
  if (kind === 'auth') return `<div class="auth">${body}</div>`;
  const inClass = kind === 'tab' || kind === 'sub';
  const fab = o.fab ? `<div class="fab-wrap${kind === 'tab' ? '' : ' no-nav'}"><button type="button" class="fab"${attrs(o.fab)}>${ic('plus', 24)}<span>${o.fab.label}</span></button></div>` : '';
  let top;
  if (kind === 'tab') top = topbar(S.className, { back: true, backLabel: 'Classes', actions: gearBtn() });
  else if (kind === 'sub') top = topbar(title, { back: true, backLabel: o.backLabel || 'Back', actions: o.actions });
  else top = topbar(title, { back: !!o.back, backLabel: o.backLabel || 'Back', actions: o.actions });
  return `<div class="app">${sidebar(o.side || (inClass ? 'bscs' : ''))}<div class="main">${top}
    <main class="page${o.narrow ? ' narrow' : ''}${o.fab ? ' has-fab' : ''}" id="page">${kind === 'tab' ? tabsWide(o.tab) : ''}${body}</main>${fab}${kind === 'tab' ? bottomNav(o.tab) : ''}</div></div>`;
}

function chargeTag(c) { return c.paid ? tag('Paid out', 'success', 'check') : tag('Not yet paid out', 'warning', 'clock'); }
function recRow(r) {
  const T = TYPE[r.type];
  const voided = !!r.voided;
  const person = r.type === 'PAYMENT' || r.type === 'WITHDRAWAL' || r.type === 'OPENING';
  const lead = person ? `<span class="avatar-typed tone-${T.tone}">${avatar(r.who, 40)}<span class="type-dot">${ic(T.icon, 12)}</span></span>` : `<span class="type-icon tone-${T.tone}">${ic(T.icon, 22)}</span>`;

  const end = `${money(r.c, { plus: true, cls: 'c-' + T.tone })}${voided ? tag('Voided', 'neutral', 'ban') : r.type === 'CHARGE' ? chargeTag(CHARGES[r.charge]) : ''}`;
  const go = r.type === 'CHARGE' ? 'charge:' + r.charge : 'record:' + r.id;
  return `<button type="button" class="list-row rec${voided ? ' void' : ''}" data-go="${go}">${lead}<span class="grow"><span class="title wrap-any" style="display:block">${title}</span><span class="sub clamp-2" style="display:block">${sub}</span>${voided ? `<span class="small c-danger" style="display:block">Voided: ${r.voided.reason}</span>` : ''}</span><span class="end-col">${end}</span></button>`;
}

const topPx = (min) => ((min - 480) / 60) * 56;
function timetableView() {
  const mgr = can('SCHEDULE_MANAGE') || isMayor();
  const head = `<div class="row wrap">${mgr ? btn('Mark no classes', { kind: 'solid', icon: 'ban', dlg: 'noclass' }) : ''}<span class="muted small grow">Week of Nov 9 · Philippine time</span></div>`;
  let grid;
  if (S.mode === 'wide') {
    const hours = Array.from({ length: 10 }, (_, i) => `<span style="top:${i * 56}px">${hm(480 + i * 60).replace(':00', '')}</span>`).join('');
    const cols = DAY_NAMES.map((d, di) => {
      const whole = WHOLE_OFF.d === di;
      const blocks = whole ? `<div class="dayoff">${tag('No classes', 'warning', 'ban')}<b>${WHOLE_OFF.reason}</b><span class="muted">Whole day</span></div>`
        : MEETINGS.filter((m) => m.d === di).map((m) => `<div class="blk${m.off ? ' off' : ''}" style="top:${topPx(m.s)}px;height:${((m.e - m.s) / 60) * 56 - 3}px"><b>${m.c}</b>${hm(m.s).replace(' ', '')} – ${hm(m.e).replace(' ', '')}<br>${m.room}${m.off ? `<br>${tag('No classes', 'warning', 'ban')}` : ''}</div>`).join('');
      return `<div class="dcol" style="height:560px">${blocks}</div>`;
    }).join('');
    grid = `<div class="card tt-wrap" style="padding:0"><div class="tt"><div class="th"></div>${DAY_NAMES.map((d, i) => `<div class="th${i === 1 ? ' today' : ''}">${d}<small>Nov ${DAY_NUMS[i]}</small></div>`).join('')}<div class="hours" style="height:560px">${hours}</div>${cols}</div></div>`;
  } else {
    grid = DAY_NAMES.map((d, di) => {
      const whole = WHOLE_OFF.d === di;
      const ms = MEETINGS.filter((m) => m.d === di);
      return `<section class="stack" style="gap:8px">${sectionHead(`${d}, Nov ${DAY_NUMS[di]}${di === 1 ? ' (today)' : ''}`)}${whole ? card(`<div class="row">${tag('No classes', 'warning', 'ban')}<span class="semibold">${WHOLE_OFF.reason}</span></div><div class="muted small" style="margin-top:4px">No classes for the whole day.</div>`) : ms.length ? card(ms.map((m) => meetingRow(m, m.off)).join(''), 'flush') : card('<div class="muted center small">No meetings</div>')}</section>`;
    }).join('');
    grid = `<div class="stack">${grid}</div>`;
  }
  return `<div class="stack lg">${head}${grid}</div>`;
}

/* ================================================================
   Router, rendering, events
   ================================================================ */
const dev = document.getElementById('dev');
const OUTSIDE = ['signin', 'classes', 'create', 'account', 'components'];
const TAB_IDS = TABS.map((t) => t[0]);
function allowed(sc) { return !sc.perm || sc.perm.split('|').some((p) => can(p) || isMayor()); }
function denied() {
  return frame('sub', 'Not available', card(empty('lock', 'You do not have access', 'Only officers with the matching permission can open this screen. Switch the viewer role in the control bar to see it.', btn('Back to Home', { kind: 'solid', go: 'home' }))), { narrow: true, backLabel: 'Home' });
}
function render(keepScroll) {
  const y = window.scrollY;
  const sc = SCREENS[S.screen] || SCREENS.home;
  document.documentElement.dataset.theme = S.theme;
  dev.className = 'dev ch-accented is-' + S.mode;
  dev.style.setProperty('--ch-accent', OUTSIDE.indexOf(S.screen) >= 0 ? '#0F766E' : S.accent);
  let html = allowed(sc) ? sc.render() : denied();
  if (S.dialog && DIALOGS[S.dialog]) html += DIALOGS[S.dialog]();
  dev.innerHTML = html;
  document.title = 'ClassHub v2 mockup';
  syncControls();
  if (keepScroll) window.scrollTo(0, y);
  const d = dev.querySelector('.dialog[role="dialog"]');
  if (d) { const f = d.querySelector('textarea,input,button'); if (f) f.focus({ preventScroll: true }); }
  const sch = dev.querySelector('[data-search]');
  if (sch && S.ui.q) { sch.value = S.ui.q; filterContents(S.ui.q); }
}
function go(target, noPush) {
  const parts = String(target).split(':');
  if (!noPush && S.screen) S.history.push({ screen: S.screen, params: S.params });
  S.screen = parts[0];
  S.params = parts[1] ? { id: parts[1] } : {};
  S.dialog = null;
  if (TAB_IDS.indexOf(S.screen) >= 0 || OUTSIDE.indexOf(S.screen) >= 0) S.history = [];
  render(false);
  window.scrollTo(0, 0);
}
function back() {
  const h = S.history.pop();
  if (!h) { go(OUTSIDE.indexOf(S.screen) >= 0 ? 'classes' : 'home', true); return; }
  S.screen = h.screen; S.params = h.params; S.dialog = null;
  render(false); window.scrollTo(0, 0);
}
function toast(msg) {
  const old = dev.querySelector('.snackbar'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'snackbar'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
  el.innerHTML = `<div>${ic('check', 18)}<span>${msg}</span></div>`;
  dev.appendChild(el);
  clearTimeout(toast.t); toast.t = setTimeout(() => el.remove(), 3200);
}
function filterContents(q) {
  q = q.trim().toLowerCase();
  let any = false;
  dev.querySelectorAll('[data-q]').forEach((r) => { const m = !q || r.dataset.q.indexOf(q) >= 0; r.hidden = !m; if (m) any = true; });
  const nm = dev.querySelector('#no-match'); if (nm) nm.hidden = any;
}
function act(name, val) {
  if (name === 'tab') { S.screen = val; S.params = {}; S.history = []; S.dialog = null; render(false); window.scrollTo(0, 0); return; }
  if (name === 'filter') S.ui.filter = val;
  else if (name === 'sched') S.ui.sched = val;
  else if (name === 'claimsTab') S.ui.claimsTab = val;
  else if (name === 'auth') S.ui.authMode = val;
  else if (name === 'done') S.done[val] = !S.done[val];
  else if (name === 'day') S.ui.selDay = val === 'all' || S.ui.selDay === +val ? null : +val;
  else if (name === 'accent') S.accent = val;
  else if (name === 'theme') { S.ui.theme = val; S.theme = val === 'DARK' ? 'dark' : 'light'; }
  else if (name === 'print') { toast('The print dialog would open here.'); return; }
  else if (name === 'seg') return;
  render(true);
}
dev.addEventListener('click', (e) => {
  const sc = e.target.closest('.scrim-in');
  if (sc && e.target === sc) { S.dialog = null; render(true); return; }
  const t = e.target.closest('[data-go],[data-act],[data-dlg],[data-back],[data-close],[data-toast]');
  if (!t || t.disabled) return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.dataset.act === 'seg') { const g = t.parentElement; g.querySelectorAll('button').forEach((b) => { b.classList.toggle('selected', b === t); b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); }); const nc = g.getAttribute('aria-labelledby') === 'nc-l'; if (nc) { const sel = dev.querySelector('.dialog select'); if (sel) sel.closest('label').hidden = t.textContent === 'Whole day'; } return; }
  if (t.dataset.toast) toast(t.dataset.toast);
  if (t.dataset.close) { S.dialog = null; if (!t.dataset.go && !t.dataset.back) render(true); }
  if (t.dataset.back) { back(); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.dlg) { S.dialog = t.dataset.dlg; render(true); return; }
  if (t.dataset.act) act(t.dataset.act, t.dataset.val);
});
dev.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.dialog) { S.dialog = null; render(true); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="link"]')) { e.preventDefault(); toast('This would open the link.'); return; }
  if (e.key === 'Tab' && S.dialog) {
    const d = dev.querySelector('.dialog[role="dialog"]'); if (!d) return;
    const f = Array.from(d.querySelectorAll('button,input,select,textarea,a[href]')).filter((x) => !x.disabled && !x.hidden && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
dev.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.mod) { S.modules[t.dataset.mod] = t.checked; render(true); }
  else if (t.dataset.vis) { S.vis = t.value; syncControls(); }
  else if (t.dataset.reveal) { const el = dev.querySelector('#' + t.dataset.reveal); if (el) el.hidden = !t.checked; }
});
dev.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.gate) { const b = dev.querySelector('[data-gated]'); if (b) b.disabled = !t.value.trim(); }
  if (t.dataset.search) { S.ui.q = t.value; filterContents(t.value); }
});

function show(id, opt) {
  opt = opt || {};
  const j = JUMPS.find((x) => x[0] === id); if (!j) throw new Error('No screen ' + id);
  if (opt.theme) S.theme = opt.theme;
  if (opt.mode) S.mode = opt.mode;
  S.role = opt.role || (j[6] && j[6].role) || (opt.keepRole ? S.role : 'treasurer');
  S.vis = opt.vis || (j[6] && j[6].vis) || (opt.keepRole ? S.vis : 'OFFICERS');
  Object.assign(S.ui, { filter: 'ALL', claimsTab: 'waiting', selDay: null, sched: 'deadlines', q: '' }, j[5] || {});
  S.modules = { ledger: true, schedule: true, timetable: true, contents: true, news: true };

  S.history = []; S.screen = j[2]; S.params = j[3] || {}; S.dialog = j[4] || null; S.jump = id;
