<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <title>ClassHub</title>
    <!--
      Shown by the Android app from inside the APK (MainActivity, from 2.0.3) when ClassHub cannot load and it
      has never loaded on the phone, in place of Android's "Webpage not available". Self-contained: no scripts
      or styles from the internet.
    -->
    <style>
      :root {
        --bg: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --brand: #0f766e;
        --on-brand: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --text: #e5e7eb;
          --muted: #94a3b8;
          --brand: #14b8a6;
          --on-brand: #042f2e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      svg {
        width: 72px;
        height: 72px;
        color: var(--brand);
      }
      h1 {
        font-size: 22px;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        background: var(--brand);
        color: var(--on-brand);
      }
      button:disabled {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 2l20 20" />
        <path d="M5.8 8.2A6 6 0 0 0 6.5 20H17" />
        <path d="M20.6 17.5A4.5 4.5 0 0 0 17.5 10h-.9A6 6 0 0 0 9.4 5.4" />
      </svg>
      <h1>ClassHub cannot load</h1>
      <p id="why">ClassHub needs the internet the first time it opens. After that, it also works offline. Connect to Wi-Fi or mobile data, then tap Try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      var retry = document.getElementById('retry');
      function go() {
        retry.disabled = true;
        retry.textContent = 'Loading…';
        window.location.replace('/');
      }
      retry.addEventListener('click', go);
      // Try again by itself as soon as the phone reports a connection.
      window.addEventListener('online', go);
    </script>
  </body>
</html>
